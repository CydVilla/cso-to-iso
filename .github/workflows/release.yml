name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist)"
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: linux-x86_64 }
          # macos-13 was retired in December 2025; macos-15-intel is the
          # remaining x86_64 image
          - { os: macos-15-intel, target: macos-x86_64 }
          - { os: macos-14, target: macos-arm64 }
          - { os: windows-latest, target: windows-x86_64 }
    timeout-minutes: 30
    # Exposed as env so the signing step can be skipped when the Azure
    # credentials are not configured yet. See .github/SIGNING.md
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the build tools
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          # bundled purely for speed on .zso images; the pure Python decoder
          # ships in the binary either way
          python -m pip install lz4 || echo "no lz4 wheel here, carrying on without it"

      - name: Run the test suite
        shell: bash
        run: python -m unittest discover -s tests -t . -v

      - name: Build the standalone binary
        shell: bash
        run: pyinstaller --onefile --console --name cso2iso cso2iso.py

      # Windows shows a SmartScreen warning for unsigned programs. Signing
      # happens before the smoke test so a broken signature fails the build
      # rather than reaching a release. Skipped entirely until the secrets in
      # .github/SIGNING.md exist, so unsigned releases keep working.
      - name: Sign the Windows binary
        if: runner.os == 'Windows' && env.AZURE_CLIENT_ID != ''
        uses: azure/artifact-signing-action@v2
        env:
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        with:
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Check the signature
        if: runner.os == 'Windows' && env.AZURE_CLIENT_ID != ''
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature dist\cso2iso.exe
          $sig | Format-List Status, StatusMessage, SignerCertificate, TimeStamperCertificate
          if ($sig.Status -ne "Valid") {
            Write-Error "signature is $($sig.Status), refusing to publish"
            exit 1
          }
          Write-Host "signed by $($sig.SignerCertificate.Subject)"

      - name: Smoke test the binary
        shell: bash
        run: |
          BIN=dist/cso2iso
          if [ "${{ runner.os }}" = "Windows" ]; then BIN=dist/cso2iso.exe; fi
          "$BIN" --version
          python - "$BIN" <<'EOF'
          import subprocess, sys, tempfile, os
          sys.path.insert(0, "tests")
          from test_cso2iso import make_cso, sample_data
          binary = sys.argv[1]
          data = sample_data(2048 * 200 + 91)
          with tempfile.TemporaryDirectory() as tmp:
              cso = os.path.join(tmp, "smoke.cso")
              iso = os.path.join(tmp, "smoke.iso")
              open(cso, "wb").write(make_cso(data, align=2))
              subprocess.run([binary, cso, "-o", iso], check=True)
              assert open(iso, "rb").read() == data, "binary produced the wrong bytes"
          print("binary round-trip ok")
          EOF

      - name: Package
        shell: bash
        run: |
          NAME="cso2iso-${{ matrix.target }}"
          mkdir -p "pkg/$NAME"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp dist/cso2iso.exe "pkg/$NAME/"
          else
            cp dist/cso2iso "pkg/$NAME/"
            chmod +x "pkg/$NAME/cso2iso"
          fi
          cp README.md LICENSE "pkg/$NAME/"
          cd pkg
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "../$NAME.zip" "$NAME" >/dev/null
          else
            tar -czf "../$NAME.tar.gz" "$NAME"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: cso2iso-${{ matrix.target }}
          path: |
            cso2iso-*.tar.gz
            cso2iso-*.zip
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Collect checksums
        run: |
          cd assets
          sha256sum cso2iso-* > SHA256SUMS
          cat SHA256SUMS

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cat > notes.md <<'EOF'
          Standalone builds of cso2iso. Nothing to install: unpack the archive
          for your system and run it. Every download contains the same
          converter, a copy of the README and the licence.

          | System | Download |
          | --- | --- |
          | Windows 10/11, 64-bit | `cso2iso-windows-x86_64.zip` |
          | macOS, Apple Silicon | `cso2iso-macos-arm64.tar.gz` |
          | macOS, Intel | `cso2iso-macos-x86_64.tar.gz` |
          | Linux, 64-bit | `cso2iso-linux-x86_64.tar.gz` |

          macOS marks anything downloaded from a browser as quarantined, so run
          `xattr -dr com.apple.quarantine cso2iso` once before the first launch.

          `SHA256SUMS` lists the checksum of every file.
          EOF
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "cso2iso $TAG" --notes-file notes.md --generate-notes
          fi
          gh release upload "$TAG" assets/* --clobber
