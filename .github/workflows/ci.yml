name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}${{ matrix.lz4 && ' + lz4' || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.9" }
          - { os: ubuntu-latest, python: "3.13" }
          # the same suite again with the optional C library, so both the pure
          # Python and the native LZ4 paths are covered
          - { os: ubuntu-latest, python: "3.13", lz4: true }
          - { os: macos-latest, python: "3.13" }
          - { os: windows-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install the optional LZ4 library
        if: matrix.lz4
        run: python -m pip install lz4

      - name: Run the test suite
        run: python -m unittest discover -s tests -t . -v

      - name: Check the package builds and installs
        run: |
          python -m pip install --upgrade pip build
          python -m build
          python -m pip install dist/*.whl
          cso2iso --version
        shell: bash
